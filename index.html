<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <title>Census A3 Map Rotator & Combiner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
</head>
<body class="bg-slate-50 font-sans min-h-screen p-6">
    <div class="max-w-xl mx-auto bg-white p-6 rounded-xl shadow-md border border-slate-200">
        <h1 class="text-xl font-bold text-slate-800 mb-2">Census 2027 A3 Map Combiner (Full Fill)</h1>
        <p class="text-xs text-slate-500 mb-6">Upload the blank A3 PDF form and map image, choose the correct rotation to point North upward, and generate the fully expanded map PDF.</p>

        <!-- Form Upload -->
        <div class="mb-4">
            <label class="block text-sm font-medium text-slate-700 mb-1">1. Select Empty Census A3 PDF</label>
            <input type="file" id="pdfFile" accept="application/pdf" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer border border-slate-300 rounded-md">
        </div>

        <!-- Image Upload -->
        <div class="mb-4">
            <label class="block text-sm font-medium text-slate-700 mb-1">2. Select Map Image</label>
            <input type="file" id="imageFile" accept="image/*" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-green-50 file:text-green-700 hover:file:bg-green-100 cursor-pointer border border-slate-300 rounded-md">
        </div>

        <!-- Rotation Selector for North alignment -->
        <div class="mb-6">
            <label class="block text-sm font-medium text-slate-700 mb-1">3. Map Rotation (Ensure North faces UP)</label>
            <select id="rotationSelect" class="w-full p-2 border border-slate-300 rounded-md text-sm bg-white">
                <option value="0">0° (No Rotation)</option>
                <option value="90">90° Clockwise</option>
                <option value="180">180° Upside Down</option>
                <option value="270">270° Clockwise (90° Counter-Clockwise)</option>
            </select>
        </div>

        <!-- Action Button -->
        <button onclick="processAndMerge()" id="processBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 px-4 rounded-md transition duration-200 shadow">
            Generate Fully Filled Census PDF
        </button>

        <!-- Status Indicator -->
        <p id="statusText" class="text-center text-xs text-slate-600 mt-4"></p>
    </div>

    <script>
        async function processAndMerge() {
            const pdfInput = document.getElementById('pdfFile');
            const imageInput = document.getElementById('imageFile');
            const rotationSelect = document.getElementById('rotationSelect');
            const statusText = document.getElementById('statusText');
            const btn = document.getElementById('processBtn');

            if (!pdfInput.files.length || !imageInput.files.length) {
                alert('Please upload both the A3 PDF form and the map image first!');
                return;
            }

            try {
                btn.disabled = true;
                statusText.textContent = 'Processing files...';

                const pdfArrayBuffer = await pdfInput.files[0].arrayBuffer();
                const imageFile = imageInput.files[0];
                const rotationAngle = parseInt(rotationSelect.value);

                const { PDFDocument } = PDFLib;
                const pdfDoc = await PDFDocument.load(pdfArrayBuffer);
                const page = pdfDoc.getPages()[0];

                const imageUrl = URL.createObjectURL(imageFile);
                const img = await new Promise((resolve, reject) => {
                    const imageObj = new Image();
                    imageObj.onload = () => resolve(imageObj);
                    imageObj.onerror = reject;
                    imageObj.src = imageUrl;
                });

                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');

                if (rotationAngle === 90 || rotationAngle === 270) {
                    canvas.width = img.height;
                    canvas.height = img.width;
                } else {
                    canvas.width = img.width;
                    canvas.height = img.height;
                }

                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.save();
                ctx.translate(canvas.width / 2, canvas.height / 2);
                ctx.rotate((rotationAngle * Math.PI) / 180);
                ctx.drawImage(img, -img.width / 2, -img.height / 2);
                ctx.restore();

                const dataUrl = canvas.toDataURL('image/jpeg', 0.95);
                const base64Data = dataUrl.split(',')[1];
                const binaryString = atob(base64Data);
                const len = binaryString.length;
                const bytes = new Uint8Array(len);
                for (let i = 0; i < len; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }

                statusText.textContent = 'Embedding full-size map into A3 layout box...';

                const embeddedImage = await pdfDoc.embedJpg(bytes);

                // Expanded dimensions to fill the entire blank box area edge-to-edge
                const boxX = 30;
                const boxY = 80;
                const boxWidth = 780;
                const boxHeight = 560;

                page.drawImage(embeddedImage, {
                    x: boxX,
                    y: boxY,
                    width: boxWidth,
                    height: boxHeight,
                });

                statusText.textContent = 'Saving finalized PDF...';

                const modifiedPdfBytes = await pdfDoc.save();
                const blob = new Blob([modifiedPdfBytes], { type: 'application/pdf' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = 'Census_2027_Full_Filled_Map.pdf';
                link.click();

                statusText.textContent = 'Done! Your expanded file has been downloaded successfully.';
                btn.disabled = false;

            } catch (error) {
                console.error(error);
                statusText.textContent = 'An error occurred during processing.';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
