<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Census 2027 Pro Map Generator - Smart Extractor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
</head>
<body class="bg-slate-100 font-sans min-h-screen flex items-center justify-center p-4">

    <div class="max-w-2xl w-full bg-white p-8 rounded-2xl shadow-lg border border-slate-200">
        <div class="border-b border-slate-200 pb-4 mb-6">
            <h1 class="text-2xl font-bold text-slate-800">Census 2027 Pro Map Generator</h1>
            <p class="text-sm text-slate-500 mt-1">Magnifies the uploaded map to detect and isolate only the primary boundaries, roads, and streets.</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            
            <!-- Left Column: Settings -->
            <div>
                <!-- Image Upload -->
                <div class="mb-4">
                    <label class="block text-sm font-semibold text-slate-700 mb-2">1. Upload Map Image</label>
                    <input type="file" id="imageInput" accept="image/*" class="w-full text-sm text-slate-500 file:mr-3 file:py-2 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer border border-slate-300 rounded-lg p-1">
                </div>

                <!-- Sketch Extractor & Advanced Filters -->
                <div class="mb-4 bg-slate-50 p-3 rounded-lg border border-slate-200">
                    <label class="flex items-center space-x-2 cursor-pointer mb-3 border-b border-slate-200 pb-2">
                        <input type="checkbox" id="extractToggle" class="w-4 h-4 text-blue-600 rounded" checked>
                        <span class="text-sm font-semibold text-slate-700">Enable Smart Extraction</span>
                    </label>
                    
                    <div id="sliderContainer" class="space-y-4 pt-1">
                        <div>
                            <label class="block text-xs font-medium text-slate-600 mb-1">Road/Boundary Detection (Brightness)</label>
                            <input type="range" id="thresholdSlider" min="100" max="255" value="165" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer">
                            <p class="text-[9px] text-slate-500 mt-1 leading-tight">Filters out the dimmed outside area and background.</p>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-600 mb-1">Text & Number Remover (Size Filter)</label>
                            <input type="range" id="noiseSlider" min="0" max="3000" value="800" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer">
                            <p class="text-[9px] text-slate-500 mt-1 leading-tight">Erases disconnected text and small icons while preserving long continuous roads.</p>
                        </div>
                    </div>
                </div>

                <!-- Orientation Selector -->
                <div class="mb-4">
                    <label class="block text-sm font-semibold text-slate-700 mb-2">2. Map Rotation</label>
                    <select id="rotationSelect" class="w-full p-2 border border-slate-300 rounded-lg text-sm bg-slate-50 font-medium text-slate-700">
                        <option value="90" selected>90° Clockwise (Default)</option>
                        <option value="0">0° (No Rotation)</option>
                        <option value="180">180° Inverted</option>
                        <option value="270">270° Clockwise</option>
                    </select>
                </div>

                <!-- Layout Controls (Defaults Set) -->
                <div class="mb-4">
                    <label class="block text-sm font-semibold text-slate-700 mb-2">3. Layout Positioning</label>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="text-[10px] uppercase font-bold text-slate-500">Left (X)</label>
                            <input type="number" id="boxX" value="25" class="w-full p-1.5 border border-slate-300 rounded text-sm bg-slate-50 font-semibold text-slate-800">
                        </div>
                        <div>
                            <label class="text-[10px] uppercase font-bold text-slate-500">Bottom (Y)</label>
                            <input type="number" id="boxY" value="55" class="w-full p-1.5 border border-slate-300 rounded text-sm bg-slate-50 font-semibold text-slate-800">
                        </div>
                        <div>
                            <label class="text-[10px] uppercase font-bold text-slate-500">Width</label>
                            <input type="number" id="boxWidth" value="680" class="w-full p-1.5 border border-slate-300 rounded text-sm bg-slate-50 font-semibold text-slate-800">
                        </div>
                        <div>
                            <label class="text-[10px] uppercase font-bold text-slate-500">Height</label>
                            <input type="number" id="boxHeight" value="850" class="w-full p-1.5 border border-slate-300 rounded text-sm bg-slate-50 font-semibold text-slate-800">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Column: Preview & Action -->
            <div class="flex flex-col">
                <label class="block text-sm font-semibold text-slate-700 mb-2">Live Magnified Preview</label>
                <div class="flex-grow border border-slate-300 bg-slate-50 rounded-lg overflow-hidden flex justify-center items-center relative min-h-[200px] mb-4 shadow-inner">
                    <canvas id="previewCanvas" class="max-w-full max-h-[350px] hidden"></canvas>
                    <p id="placeholder" class="text-slate-400 text-sm absolute">Upload map to preview</p>
                </div>

                <button onclick="generatePDF()" id="processBtn" class="w-full bg-blue-600 hover:bg-blue-700 active:scale-[0.99] text-white font-bold py-3 px-4 rounded-xl transition duration-150 shadow-md disabled:opacity-50 disabled:cursor-not-allowed">
                    Generate Final A3 PDF
                </button>
                <p id="statusText" class="text-center text-xs font-medium text-slate-600 mt-3 h-4"></p>
            </div>
        </div>
    </div>

    <script>
        const TEMPLATE_PDF_PATH = './census_template.pdf';
        
        // Processing Magnifier
        const INTERNAL_SCALE = 2.0;

        const imageInput = document.getElementById('imageInput');
        const extractToggle = document.getElementById('extractToggle');
        const thresholdSlider = document.getElementById('thresholdSlider');
        const noiseSlider = document.getElementById('noiseSlider');
        const sliderContainer = document.getElementById('sliderContainer');
        const previewCanvas = document.getElementById('previewCanvas');
        const ctx = previewCanvas.getContext('2d', { willReadFrequently: true });
        const placeholder = document.getElementById('placeholder');
        
        let originalImg = new Image();
        let updateTimeout;

        imageInput.addEventListener('change', handleImageUpload);
        extractToggle.addEventListener('change', () => {
            sliderContainer.style.opacity = extractToggle.checked ? '1' : '0.4';
            sliderContainer.style.pointerEvents = extractToggle.checked ? 'auto' : 'none';
            triggerUpdate();
        });
        
        thresholdSlider.addEventListener('input', triggerUpdate);
        noiseSlider.addEventListener('input', triggerUpdate);

        function triggerUpdate() {
            clearTimeout(updateTimeout);
            updateTimeout = setTimeout(updatePreview, 50); 
        }

        function handleImageUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                originalImg.onload = () => {
                    // Magnify canvas for high-precision detection
                    previewCanvas.width = originalImg.width * INTERNAL_SCALE;
                    previewCanvas.height = originalImg.height * INTERNAL_SCALE;
                    placeholder.classList.add('hidden');
                    previewCanvas.classList.remove('hidden');
                    updatePreview();
                }
                originalImg.src = event.target.result;
            }
            reader.readAsDataURL(file);
        }

        function updatePreview() {
            if (!originalImg.src) return;

            // Draw magnified original
            ctx.drawImage(originalImg, 0, 0, previewCanvas.width, previewCanvas.height);

            if (extractToggle.checked) {
                const width = previewCanvas.width;
                const height = previewCanvas.height;
                const imageData = ctx.getImageData(0, 0, width, height);
                const data = imageData.data;
                
                const threshold = parseInt(thresholdSlider.value);
                const minArea = parseInt(noiseSlider.value);

                // Step 1: Strict High-Brightness Threshold
                // This targets the bright white lines and ignores the dimmed outside areas
                for (let i = 0; i < data.length; i += 4) {
                    const r = data[i], g = data[i+1], b = data[i+2];
                    const brightness = (r + g + b) / 3;

                    if (brightness > threshold) {
                        data[i] = 0; data[i+1] = 0; data[i+2] = 0; // Turn roads/boundaries Black
                    } else {
                        data[i] = 255; data[i+1] = 255; data[i+2] = 255; // Turn everything else White
                    }
                }

                // Step 2: Advanced Area Filter (Wipes out text, icons, and scattered pixels)
                if (minArea > 0) {
                    const visited = new Uint8Array(width * height);
                    const queue = new Int32Array(width * height);
                    const component = new Int32Array(width * height);

                    for (let i = 0; i < width * height; i++) {
                        // If pixel is a black line and unvisited
                        if (data[i * 4] === 0 && visited[i] === 0) {
                            let head = 0, tail = 0, compTail = 0;
                            
                            queue[tail++] = i;
                            visited[i] = 1;

                            // Flood-fill to measure the continuous size of the line/shape
                            while (head < tail) {
                                let curr = queue[head++];
                                component[compTail++] = curr;

                                let cy = Math.floor(curr / width);
                                let cx = curr % width;

                                // 8-way directional check
                                for (let dy = -1; dy <= 1; dy++) {
                                    for (let dx = -1; dx <= 1; dx++) {
                                        if (dx === 0 && dy === 0) continue;
                                        
                                        let nx = cx + dx;
                                        let ny = cy + dy;

                                        if (nx >= 0 && nx < width && ny >= 0 && ny < height) {
                                            let nIdx = ny * width + nx;
                                            if (data[nIdx * 4] === 0 && visited[nIdx] === 0) {
                                                visited[nIdx] = 1;
                                                queue[tail++] = nIdx;
                                            }
                                        }
                                    }
                                }
                            }

                            // If the shape is smaller than the threshold, it's text/noise -> Erase it
                            if (compTail < minArea) {
                                for (let k = 0; k < compTail; k++) {
                                    let idx = component[k] * 4;
                                    data[idx] = 255;     // R
                                    data[idx + 1] = 255; // G
                                    data[idx + 2] = 255; // B
                                }
                            }
                        }
                    }
                }

                ctx.putImageData(imageData, 0, 0);
            }
        }

        async function generatePDF() {
            if (!originalImg.src) {
                alert('Please upload a map image first!');
                return;
            }

            const btn = document.getElementById('processBtn');
            const statusText = document.getElementById('statusText');
            const rotationAngle = parseInt(document.getElementById('rotationSelect').value);
            const boxX = parseFloat(document.getElementById('boxX').value);
            const boxY = parseFloat(document.getElementById('boxY').value);
            const boxWidth = parseFloat(document.getElementById('boxWidth').value);
            const boxHeight = parseFloat(document.getElementById('boxHeight').value);

            try {
                btn.disabled = true;
                statusText.textContent = 'Fetching template PDF...';

                const response = await fetch(TEMPLATE_PDF_PATH);
                if (!response.ok) throw new Error("Could not load PDF template.");
                const pdfArrayBuffer = await response.arrayBuffer();

                statusText.textContent = 'Rotating and formatting image...';

                const offscreenCanvas = document.createElement('canvas');
                const offCtx = offscreenCanvas.getContext('2d');
                
                if (rotationAngle === 90 || rotationAngle === 270) {
                    offscreenCanvas.width = previewCanvas.height;
                    offscreenCanvas.height = previewCanvas.width;
                } else {
                    offscreenCanvas.width = previewCanvas.width;
                    offscreenCanvas.height = previewCanvas.height;
                }

                offCtx.translate(offscreenCanvas.width / 2, offscreenCanvas.height / 2);
                offCtx.rotate((rotationAngle * Math.PI) / 180);
                offCtx.drawImage(previewCanvas, -previewCanvas.width / 2, -previewCanvas.height / 2);

                const base64Data = offscreenCanvas.toDataURL('image/jpeg', 0.95).split(',')[1];
                const binaryString = atob(base64Data);
                const bytes = new Uint8Array(binaryString.length);
                for (let i = 0; i < binaryString.length; i++) bytes[i] = binaryString.charCodeAt(i);

                statusText.textContent = 'Embedding into PDF...';

                const { PDFDocument } = PDFLib;
                const pdfDoc = await PDFDocument.load(pdfArrayBuffer);
                const page = pdfDoc.getPages()[0];
                const embeddedImage = await pdfDoc.embedJpg(bytes);

                // Employs the hardcoded requested dimensions
                page.drawImage(embeddedImage, { x: boxX, y: boxY, width: boxWidth, height: boxHeight });

                statusText.textContent = 'Downloading...';

                const modifiedPdfBytes = await pdfDoc.save();
                const blob = new Blob([modifiedPdfBytes], { type: 'application/pdf' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = 'Census_2027_Final_Map.pdf';
                link.click();

                statusText.textContent = 'Success! File Downloaded.';
            } catch (error) {
                console.error(error);
                statusText.textContent = 'Error: ' + error.message;
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
